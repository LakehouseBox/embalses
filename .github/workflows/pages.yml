name: Publish site
# The page is a LakehouseBox artifact (artifact/), published as its next version on every change.
# GitHub Pages (site/) only redirects the old address there, with its share card.
on:
  push:
    branches: [main]
    paths: ['site/**', 'artifact/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
  artifact:
    # The page: published as the next version of the artifact named in artifact/artifact.json.
    # Needs the repository secret LHBOX_API_KEY.
    runs-on: ubuntu-latest
    env:
      LHBOX_API_KEY: ${{ secrets.LHBOX_API_KEY }}
      LHBOX_NO_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install lhbox
        run: curl -fsSL https://lakehousebox.com/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish the next version
        run: |
          # Uploads from hosted runners to LakehouseBox stall on a path-MTU black hole (lakehousebox#28, #33):
          # let the kernel probe for a smaller segment size instead of waiting.
          sudo sysctl -qw net.ipv4.tcp_mtu_probing=1
          if [ -z "$LHBOX_API_KEY" ]; then echo "::warning::LHBOX_API_KEY is not set: the artifact was not published."; exit 0; fi
          lhbox artifact publish artifact --note "$(git log -1 --format=%s | cut -c1-200)"
