name: Lakehouse
# What runs on LakehouseBox is what is in main: a pull request shows the plan, a merge applies it.
# The terraform job then checks that main.tf describes the same deployment: after a merge its plan must be empty.
# Needs the repository secret LHBOX_API_KEY (an API key of the catalog's owner; `lhbox api-key create`).
on:
  pull_request:
    paths: ['sql/migrations/**', 'sql/ingest/**', 'sql/now/**', 'docs/AGENTS.md', 'docs/table_docs.json', 'lakehouse.yaml', 'main.tf', '.terraform.lock.hcl', 'tools/tofu_adopt.sh', '.github/workflows/lakehouse.yml']
  push:
    branches: [main]
    paths: ['sql/migrations/**', 'sql/ingest/**', 'sql/now/**', 'docs/AGENTS.md', 'docs/table_docs.json', 'lakehouse.yaml', 'main.tf', '.terraform.lock.hcl', 'tools/tofu_adopt.sh', '.github/workflows/lakehouse.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lakehouse-${{ github.ref }}
  cancel-in-progress: false
env:
  LHBOX_API_KEY: ${{ secrets.LHBOX_API_KEY }}
  LHBOX_NO_VERSION_CHECK: '1'
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lhbox
        run: curl -fsSL https://lakehousebox.com/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan (nothing is changed)
        run: |
          if [ -z "$LHBOX_API_KEY" ]; then echo "No LHBOX_API_KEY here (a fork, or the secret is not set): skipping the plan."; exit 0; fi
          lhbox migrate --catalog embalses --dry-run
          lhbox plan -f lakehouse.yaml
  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lhbox
        run: curl -fsSL https://lakehousebox.com/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Migrate and apply
        run: |
          if [ -z "$LHBOX_API_KEY" ]; then echo "::warning::LHBOX_API_KEY is not set: nothing was applied."; exit 0; fi
          lhbox migrate --catalog embalses
          lhbox apply -f lakehouse.yaml
          lhbox plan -f lakehouse.yaml
  terraform:
    # main.tf declares the same deployment as lakehouse.yaml. This job adopts the live catalog into a throwaway
    # state (imports change nothing on LakehouseBox) and plans: on a pull request the plan is shown, on main it
    # must be empty, so the two declarations cannot drift apart. It never applies.
    needs: [plan, apply]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false   # the wrapper hides tofu's exit code, and the plan's exit code is the check
      - name: Install lhbox
        run: curl -fsSL https://lakehousebox.com/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Format and validate
        run: |
          tofu fmt -check -diff
          tofu init -input=false -lockfile=readonly
          tofu validate
      - name: Plan against the live catalog
        env:
          # Go's post-quantum key share makes a ClientHello too large for something on the path from hosted
          # runners to the API: the handshake times out. Without it the provider connects.
          GODEBUG: tlsmlkem=0
        run: |
          if [ -z "$LHBOX_API_KEY" ]; then echo "No LHBOX_API_KEY here: skipping the plan."; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sh tools/tofu_adopt.sh -input=false
          else
            sh tools/tofu_adopt.sh -input=false -detailed-exitcode   # exit 2 = main.tf and the live catalog differ
          fi
