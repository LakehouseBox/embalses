# embalses on LakehouseBox, declared.
# Applied with LakehouseBox's own tools:
#
#   lhbox migrate --catalog embalses     # sql/migrations/*.sql in order: tables, partitioning, descriptions
#   lhbox plan -f lakehouse.yaml         # what apply would create or change
#   lhbox apply -f lakehouse.yaml        # creates and updates; never deletes without --prune, never publishes without --publish
#
# Tables are not declared here: they live in sql/migrations/ (append-only, reviewed SQL), the way
# Flyway or dbt own schemas while Terraform owns infrastructure. Nothing below ever drops data.

version: 1

project: public-data

catalogs:
  embalses:
    public: true
    default_format_version: 3          # geometry columns (Iceberg v3 GEOMETRY)
    agents_md: docs/AGENTS.md
    table_docs: docs/table_docs.json   # table and column descriptions, pushed on apply
    migrations: sql/migrations/

    post_prefixes:                     # where scheduled SQL may send a request body (form POSTs of the SAIH viewers)
      - https://saihweb.chsegura.es/apps/iVisor/
      - https://visor.saichcantabrico.es/wp-admin/
      - https://siraguadiana.com/backend/

    connections:
      # The AEMET key is the organisation's existing web integration, not a copy (tablemere#3001, G7).
      aemet:
        url_prefix: https://opendata.aemet.es/
        integration: aemet

    sinks:
      # ── pulled by LakehouseBox itself (scheduled SQL over public URLs) ──
      # live reservoir readings: one sink per SAIH network, all appending to the same table
      saih_ebro: { table: obs.reservoir_readings, sql: sql/ingest/reservoir_readings_ebro.sql, every: 15m, offset: 2m }
      saih_guadalquivir: { table: obs.reservoir_readings, sql: sql/ingest/reservoir_readings_guadalquivir.sql, every: 15m, offset: 4m }
      saih_segura: { table: obs.reservoir_readings, sql: sql/ingest/reservoir_readings_segura.sql, every: 15m, offset: 6m }
      saih_minosil: { table: obs.reservoir_readings, sql: sql/ingest/reservoir_readings_minosil.sql, every: 15m, offset: 8m }
      saih_cantabrico: { table: obs.reservoir_readings, sql: sql/ingest/reservoir_readings_cantabrico.sql, every: 15m, offset: 10m }
      saih_guadiana: { table: obs.reservoir_readings, sql: sql/ingest/reservoir_readings_guadiana.sql, every: 1h, offset: 12m }   # one request per reservoir, so hourly

      miteco_reservoir_weekly:
        table: obs.reservoir_weekly
        sql: sql/ingest/reservoir_weekly.sql        # MITECO weekly bulletin (published Tuesdays)
        every: 1d
        offset: 6h

      aemet_precipitation:                           # created by the key's owner: the web key goes only into their queries
        table: obs.precipitation
        sql: sql/ingest/aemet_precipitation.sql
        every: 30m
        offset: 23m

      aemet_weather:
        table: obs.weather
        sql: sql/ingest/aemet_weather.sql
        every: 30m
        offset: 23m

      # ── derived tables: scheduled SQL that reads the catalog itself; each run replaces the table ──
      now_rain_grid:        { table: now.rain_grid,        sql: sql/now/rain_grid.sql,        every: 1h, offset: 28m, mode: replace, min_rows: 1000, format_version: 2 }
      now_upstream_rain:    { table: now.upstream_rain,    sql: sql/now/upstream_rain.sql,    every: 1h, offset: 31m, mode: replace, min_rows: 300,  format_version: 2 }
      now_reservoir_status: { table: now.reservoir_status, sql: sql/now/reservoir_status.sql, every: 1h, offset: 34m, mode: replace, min_rows: 300,  format_version: 2 }
      now_basin_summary:    { table: now.basin_summary,    sql: sql/now/basin_summary.sql,    every: 1h, offset: 37m, mode: replace, min_rows: 10,   format_version: 2 }
      now_station_status:   { table: now.station_status,   sql: sql/now/station_status.sql,   every: 1h, offset: 40m, mode: replace, min_rows: 300,  format_version: 2 }

    agents:
      embalses_headline:
        model: deepseek-v4-flash
        schedule: "35 * * * *"
        tz: Europe/Madrid
        reads: [embalses]
        writes: [embalses.now.headlines]
        prompt: docs/agent_headline.md
